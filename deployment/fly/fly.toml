
app = 'perplexed-purple'
primary_region = 'sjc'

[build]

[env]
DOMAINS_ALLOW = "http://localhost:30000,https://perplexed-purple.fly.dev"

[http_service]
  internal_port = 30000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
